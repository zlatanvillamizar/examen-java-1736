name: Java CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, feature/servicios-database]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --protocol=tcp --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit and isolated MySQL tests
        env:
          CARMOTORS_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/
          CARMOTORS_TEST_DB_USER: root
        run: mvn --batch-mode --no-transfer-progress clean verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/
