<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 518" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Diagrama de clases del módulo Vehículos</title>
  <desc id="descripcion">Main abre MenuPrincipal, que delega en VistaVehiculos. La vista usa el controlador, que usa el servicio. El servicio usa VehiculoDAO y ClienteDAO. VehiculoDAO convierte filas a Vehiculo y recibe una FuenteConexion.</desc>
  <defs>
    <marker id="flecha" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M1 1L8 4L1 7" fill="none" stroke="#3b5872" stroke-width="1.5"/>
    </marker>
    <style>
      .caja { fill: #fff; stroke: #3b5872; stroke-width: 1.5; }
      .dependencia { fill: none; stroke: #3b5872; stroke-width: 1.6; marker-end: url(#flecha); }
      .nombre { font: bold 16px sans-serif; fill: #123550; text-anchor: middle; }
      .miembro { font: 14px sans-serif; fill: #243b50; }
      .separador { stroke: #9bb3c6; }
    </style>
  </defs>
  <rect width="910" height="518" fill="#f1f6fa"/>
  <text x="24" y="35" style="font:bold 23px sans-serif;fill:#123550">Vehículos · clases y dependencias</text>
  <g class="dependencia">
    <path d="M148 93H193"/>
    <path d="M353 93H389"/>
    <path d="M589 93H640"/>
    <path d="M763 145V170H456V193"/>
    <path d="M315 248H236"/>
    <path d="M449 298V356"/>
    <path d="M576 245H651"/>
    <path d="M578 405H651"/>
    <path d="M315 405H236"/>
  </g>
  <g>
    <rect class="caja" x="24" y="67" width="124" height="52"/>
    <text class="nombre" x="86" y="99">Main</text>
    <rect class="caja" x="193" y="67" width="160" height="52"/>
    <text class="nombre" x="273" y="99">MenuPrincipal</text>
    <rect class="caja" x="389" y="67" width="200" height="77"/>
    <text class="nombre" x="489" y="93">VistaVehiculos</text>
    <path class="separador" d="M389 104H589"/>
    <text class="miembro" x="403" y="126">mostrar()</text>
    <rect class="caja" x="640" y="67" width="246" height="78"/>
    <text class="nombre" x="763" y="93">VehiculoControlador</text>
    <path class="separador" d="M640 104H886"/>
    <text class="miembro" x="654" y="126">registrar, buscar y listar</text>
  </g>
  <g>
    <rect class="caja" x="315" y="193" width="261" height="105"/>
    <text class="nombre" x="445" y="220">VehiculoService</text>
    <path class="separador" d="M315 231H576"/>
    <text class="miembro" x="329" y="253">registrar(vehiculo), listar()</text>
    <text class="miembro" x="329" y="277">buscarPorId(id), buscarPorPlaca(placa)</text>
    <rect class="caja" x="24" y="212" width="212" height="76"/>
    <text class="nombre" x="130" y="238">ClienteDAO</text>
    <path class="separador" d="M24 249H236"/>
    <text class="miembro" x="38" y="271">buscarPorId(id)</text>
    <rect class="caja" x="315" y="356" width="263" height="101"/>
    <text class="nombre" x="446" y="382">VehiculoDAO</text>
    <path class="separador" d="M315 393H578"/>
    <text class="miembro" x="329" y="416">registrar(vehiculo), listar()</text>
    <text class="miembro" x="329" y="440">buscarPorId(id), buscarPorPlaca(placa)</text>
    <rect class="caja" x="24" y="365" width="212" height="91"/>
    <text class="nombre" x="130" y="390">FuenteConexion</text>
    <path class="separador" d="M24 401H236"/>
    <text class="miembro" x="38" y="423">obtener(): Connection</text>
    <text class="miembro" x="38" y="444">Por defecto: ConexionFactory</text>
    <rect class="caja" x="651" y="212" width="235" height="244"/>
    <text class="nombre" x="768" y="239">Vehiculo</text>
    <path class="separador" d="M651 250H886"/>
    <text class="miembro" x="667" y="276">id: int</text>
    <text class="miembro" x="667" y="302">clienteId: int</text>
    <text class="miembro" x="667" y="328">placa: String</text>
    <text class="miembro" x="667" y="354">marca: String</text>
    <text class="miembro" x="667" y="380">modelo: String</text>
    <text class="miembro" x="667" y="406">anio: int</text>
  </g>
  <path class="dependencia" d="M24 488H65"/>
  <text class="miembro" x="75" y="493">Depende de</text>
</svg>
